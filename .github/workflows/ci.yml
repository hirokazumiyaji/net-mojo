name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  proptest:
    name: Property tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
    env:
      PROPTEST_SEED: "1"
      PROPTEST_MAX_EXAMPLES: "100"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347
        with:
          frozen: true
          environments: proptest proptest-http2
      - name: Test semantic properties
        run: pixi run -e proptest test-prop
      - name: Test HPACK properties
        run: pixi run -e proptest-http2 test-prop-hpack

  fuzz:
    name: Fuzz smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-14]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347
        with:
          frozen: true
      - name: Verify fuzz task coverage
        run: |
          python3 - <<'PYTHON'
          import tomllib
          from pathlib import Path
          tasks = tomllib.loads(Path("pixi.toml").read_text())["feature"]["fuzz"]["tasks"]
          expected = {"fuzz-build", "fuzz-native-build", "fuzz-http1", "fuzz-authority", "fuzz-http2-frames", "fuzz-ip", "fuzz-address", "fuzz-hpack-mojo", "fuzz-hpack", "fuzz-smoke", "fuzz-driver-test", "fuzz-nightly", "fuzz-nightly-test", "fuzz-minimize", "fuzz-minimize-test"}
          assert set(tasks) == expected, set(tasks) ^ expected
          assert tasks["fuzz-smoke"]["depends-on"] == ["fuzz-build"]
          assert {"task": "fuzz-parser-build", "environment": "sanitize"} in tasks["fuzz-build"]["depends-on"]
          PYTHON
      - name: Test mutation and replay driver
        run: pixi run -e fuzz fuzz-driver-test
      - name: Test bounded nightly replay metadata
        run: pixi run -e fuzz fuzz-nightly-test
      - name: Test structured minimization with fixed markers
        run: pixi run -e fuzz fuzz-minimize-test
      - name: Fuzz protocol parsers and native HPACK
        run: pixi run -e fuzz fuzz-smoke
      - name: Preserve replay inputs and crash artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fuzz-failure-${{ matrix.os }}
          path: build/fuzz/
          if-no-files-found: ignore

  http2:
    name: HTTP/2 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347
        with:
          frozen: true
      - name: Test HTTP/2 HPACK provider
        run: pixi run -e tls-http2 hpack-mojo-test
      - name: Test TLS and independent HTTP/2 client
        run: pixi run -e tls-http2 tls-suite
      - name: Test independent hyper-h2 interop
        run: pixi run -e tls-http2 https-h2-interop-test
      - name: Test packaged HTTP/2 provider
        run: pixi run -e tls-http2 http2-package-smoke
      - name: Build HTTP/2 example
        run: pixi run -e tls-http2 http2-example-build
      - name: Test shared HTTP/1.1 and HTTP/2 application contract
        run: pixi run -e tls-http2 http-app-contract-test
      - name: Test HTTP/2 integration gaps
        run: pixi run -e tls-http2 http2-integration-test
      - name: Test shared-listener HTTP worker pool
        run: pixi run -e tls-http2 http-pool-integration-test
      - name: Run HTTP/2 example with independent client
        run: pixi run -e tls-http2 http2-example-run

  http3:
    name: HTTP/3 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347
        with:
          frozen: true
      - name: Test HTTP/3 provider and integration
        run: pixi run -e tls-http3 quic-suite
      - name: Test independent HTTP/3 client
        run: pixi run -e tls-http3 http3-client-test
      - name: Test shared TCP and worker-zero QUIC pool
        run: pixi run -e tls-http3 http-pool-quic-integration-test
      - name: Test HTTP same-origin fallback
        run: pixi run -e tls-http3 http-same-origin-test
      - name: Test packaged HTTP/3 provider
        run: pixi run -e tls-http3 http3-package-smoke
      - name: Build HTTP/3 example
        run: pixi run -e tls-http3 http3-example-build
      - name: Run HTTP/3 example with independent client
        run: pixi run -e tls-http3 http3-example-run
      - name: Run HTTP/3 worker pool example with independent client
        run: pixi run -e tls-http3 http3-pool-example-run

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347
        with:
          frozen: true
      - name: Format Mojo sources
        run: pixi run format
      - name: Verify formatting
        run: git diff --exit-code
      - name: Verify test tasks mirror pixi
        run: |
          diff -u \
            <(awk '/^\[feature\./ {exit} /^test-[a-z0-9-]+/ {sub(/ .*/, ""); print}' pixi.toml | sort -u) \
            <(awk '$1 == "run:" && $2 == "pixi" && $3 == "run" && $4 ~ /^test-/ {print $4}' .github/workflows/ci.yml | sort -u)
          for t in $(awk '/^\[feature\./ {exit} /^test-[a-z0-9-]+/ {sub(/ .*/, ""); print}' pixi.toml | sort -u); do
            [ "$t" = "test-package" ] && continue
            grep -q "\"$t\"," pixi.toml || { echo "$t missing from 'test' aggregate"; exit 1; }
          done
      # Individual test steps match `pixi run test` in pixi.toml for step-level triage.
      - name: Test core
        run: pixi run test-core
      - name: Test IP addresses
        run: pixi run test-ip
      - name: Test socket addresses
        run: pixi run test-address
      - name: Test system bindings
        run: pixi run test-sys
      - name: Test TCP
        run: pixi run test-tcp
      - name: Test UDP
        run: pixi run test-udp
      - name: Test Unix sockets
        run: pixi run test-unix
      - name: Test Poller multiplexing
        run: pixi run test-poll
      - name: Test Reactor readiness
        run: pixi run test-reactor
      - name: Test HTTP API probe
        run: pixi run test-http-api
      - name: Test HTTP control
        run: pixi run test-http-control
      - name: Test HTTP worker pool
        run: pixi run test-http-pool
      - name: Test HTTP parser
        run: pixi run test-http-parser
      - name: Test HTTP response
        run: pixi run test-http-response
      - name: Test HTTP route patterns
        run: pixi run test-http-router
      - name: Test HTTP server
        run: pixi run test-http-server
      - name: Build HPACK shim for HTTP/2 session tests
        run: pixi run -e http2 hpack-test
      - name: Test HTTP/2 frame parser
        run: pixi run test-http2
      - name: Test TLS and HTTPS
        run: pixi run -e tls tls-suite
      - name: Test HTTP detach
        run: pixi run test-http-detach
      - name: Test actor primitives
        run: pixi run test-actor
      - name: Package precompiled artifact
        run: pixi run package
      - name: Verify packaged artifact
        run: pixi run test-package
      - name: Test continuous dogfooding example
        run: pixi run dogfood-smoke
      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: "1.26.x"
          cache-dependency-path: benchmarks/http_go/go.sum
      - name: Measure HTTP worker counts (descriptive)
        timeout-minutes: 5
        run: |
          set -o pipefail
          pixi run benchmark-http-server | tee http-worker-benchmark.txt
      - name: Retain HTTP worker benchmark
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: http-worker-benchmark-${{ matrix.os }}
          path: http-worker-benchmark.txt
          if-no-files-found: ignore
      - name: Test HTTP benchmark harness regression
        run: pixi run benchmark-harness-test
      - name: Test Go HTTP loader
        run: pixi run benchmark-go-test

  sanitize:
    name: Sanitize (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - ubuntu-24.04
          - ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pixi
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347
        with:
          frozen: true
      - name: Verify sanitize tasks mirror pixi
        run: |
          diff -u \
            <(grep -oE '^sanitize-[a-z0-9-]+' pixi.toml | sort -u) \
            <(awk '$1 == "run:" && $2 == "pixi" && $3 == "run" && $4 ~ /^sanitize-/ {print $4}' .github/workflows/ci.yml | sort -u)
          for t in $(grep -oE '^sanitize-[a-z0-9-]+' pixi.toml | sort -u); do
            grep -q "\"$t\"," pixi.toml || { echo "$t missing from 'sanitize' aggregate"; exit 1; }
          done
      # Individual sanitize steps match `pixi run sanitize` in pixi.toml for step-level triage.
      - name: Sanitize system bindings
        run: pixi run sanitize-sys
      - name: Sanitize TCP
        run: pixi run sanitize-tcp
      - name: Sanitize UDP
        run: pixi run sanitize-udp
      - name: Sanitize Unix sockets
        run: pixi run sanitize-unix
      - name: Sanitize Reactor readiness
        run: pixi run sanitize-reactor
      - name: Sanitize actor primitives
        run: pixi run sanitize-actor
      - name: Sanitize HTTP API probe
        run: pixi run sanitize-http-api
      - name: Sanitize HTTP control
        run: pixi run sanitize-http-control
      - name: Sanitize HTTP worker pool
        run: pixi run sanitize-http-pool
      - name: Sanitize HTTP parser
        run: pixi run sanitize-http-parser
      - name: Sanitize HTTP response
        run: pixi run sanitize-http-response
      - name: Sanitize HTTP router
        run: pixi run sanitize-http-router
      - name: Sanitize HTTP server
        run: pixi run sanitize-http-server
      - name: Sanitize HTTP/2 frame parser
        run: pixi run sanitize-http2
      - name: Sanitize HTTP detach
        run: pixi run sanitize-http-detach
