name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - conda.recipe/**
      - scripts/check_release_version.sh
      - scripts/build_conda.sh
      - scripts/test_release_version.py
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-14
            platform: osx-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check release versions
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/check_release_version.sh "$GITHUB_REF_NAME"

      - name: Test release checks
        run: python3 scripts/test_release_version.py

      - name: Build and test conda package
        uses: prefix-dev/rattler-build-action@1ca5f45832f419a46d1326ccc5861d7e14d67c44 # v0.2.39
        with:
          artifact-name: net-${{ matrix.platform }}
          rattler-build-version: v0.74.0
          recipe-path: conda.recipe/recipe.yaml
          build-args: >-
            -c conda-forge
            -c https://conda.modular.com/max

      - name: Install pinned Mojo toolchain
        uses: prefix-dev/setup-pixi@f00437f565399d418b0acc85936d12c1fb668347
        with:
          frozen: true

      - name: Build precompiled release artifact
        run: |
          pixi run package
          pixi run test-package
          mkdir -p dist
          cp build/net.mojoc "dist/net-${{ matrix.platform }}.mojoc"

      - name: Upload precompiled artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: net-precompiled-${{ matrix.platform }}
          path: dist/*.mojoc
          if-no-files-found: error

  prefix-publish:
    name: Publish conda packages
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: Download conda packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: net-*
          path: dist
          merge-multiple: true

      - name: Install rattler-build
        uses: prefix-dev/rattler-build-action@1ca5f45832f419a46d1326ccc5861d7e14d67c44 # v0.2.39
        with:
          rattler-build-version: v0.74.0
          setup-only: true
          upload-artifact: false

      - name: Upload packages to prefix.dev
        env:
          PREFIX_CHANNEL: ${{ vars.PREFIX_CHANNEL }}
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          test -n "$PREFIX_CHANNEL"
          test -n "$PREFIX_API_KEY"
          shopt -s globstar nullglob
          packages=(dist/**/*.conda)
          test "${#packages[@]}" -eq 3
          rattler-build upload prefix --channel "$PREFIX_CHANNEL" "${packages[@]}"

  github-release:
    name: GitHub Release
    needs: prefix-publish
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: net-*
          path: dist
          merge-multiple: true

      # The release description written on GitHub is the release notes, so an
      # existing release only receives the assets.
      - name: Attach packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s globstar nullglob
          assets=(dist/**/*.conda dist/*.mojoc)
          test "${#assets[@]}" -eq 6
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
