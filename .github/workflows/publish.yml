name: Publish

on:
  push:
    tags:
      - "v*.*.*"
  # Pull requests and manual runs build and test the packages without uploading them.
  pull_request:
    paths:
      - conda.recipe/**
      - scripts/check_release_version.sh
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-14
            platform: osx-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Check release versions
        if: startsWith(github.ref, 'refs/tags/')
        run: bash scripts/check_release_version.sh "$GITHUB_REF_NAME"

      - name: Build and test conda package
        uses: prefix-dev/rattler-build-action@1ca5f45832f419a46d1326ccc5861d7e14d67c44 # v0.2.39
        with:
          artifact-name: net-mojo-${{ matrix.platform }}
          build-args: >-
            --recipe conda.recipe/recipe.yaml
            -c conda-forge
            -c https://conda.modular.com/max

      - name: Upload package to prefix.dev
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PREFIX_CHANNEL: ${{ vars.PREFIX_CHANNEL }}
          PREFIX_API_KEY: ${{ secrets.PREFIX_API_KEY }}
        run: |
          test -n "$PREFIX_CHANNEL"
          test -n "$PREFIX_API_KEY"
          packages="$(find output -type f -name '*.conda' -print)"
          test -n "$packages"
          find output -type f -name '*.conda' -exec rattler-build upload prefix --channel "$PREFIX_CHANNEL" {} +

  github-release:
    name: GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: net-mojo-*
          path: dist
          merge-multiple: true

      - name: Resolve release notes
        id: notes
        run: |
          notes_file="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$notes_file" ]; then
            echo "path=$notes_file" >> "$GITHUB_OUTPUT"
          else
            echo "path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@6cbd405e2c4e67a21c47fa9e383d020e4e28b836 # v2.3.3
        with:
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.path == '' }}
          files: dist/**/*.conda
