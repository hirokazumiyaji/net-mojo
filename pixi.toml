[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "net-mojo"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
format = "mojo format net tests examples benchmarks"
test-core = "mojo run --Werror -I . tests/test_core.mojo"
test-ip = "mojo run --Werror -I . tests/test_ip.mojo"
test-address = "mojo run --Werror -I . tests/test_address.mojo"
test-sys = "mojo run --Werror -I . tests/test_sys.mojo"
test-tcp = "mojo run --Werror -I . tests/test_tcp.mojo"
test-udp = "mojo run --Werror -I . tests/test_udp.mojo"
test-unix = "mojo run --Werror -I . tests/test_unix.mojo"
test-poll = "mojo run --Werror -I . tests/test_poll.mojo"
test-reactor = "mojo run --Werror -I . tests/test_reactor.mojo"
test-http-api = "mojo run --Werror -I . tests/test_http_api.mojo"
test-http-parser = "mojo run --Werror -I . tests/test_http_parser.mojo"
test-http-response = "mojo run --Werror -I . tests/test_http_response.mojo"
test-http-server = "mojo run --Werror -I . tests/test_http_server.mojo"
sanitize-sys = "mojo run --sanitize address -I . tests/test_sys.mojo"
sanitize-tcp = "mojo run --sanitize address -I . tests/test_tcp.mojo"
sanitize-udp = "mojo run --sanitize address -I . tests/test_udp.mojo"
sanitize-unix = "mojo run --sanitize address -I . tests/test_unix.mojo"
test = { depends-on = [
  "test-core",
  "test-ip",
  "test-address",
  "test-sys",
  "test-tcp",
  "test-udp",
  "test-unix",
  "test-poll",
  "test-reactor",
  "test-http-api",
  "test-http-parser",
  "test-http-response",
  "test-http-server",
] }
example-tcp = "mojo run --Werror -I . examples/tcp_echo.mojo"
example-udp = "mojo run --Werror -I . examples/udp_echo.mojo"
example-unix = "mojo run --Werror -I . examples/unix_echo.mojo"
example-http-hello = "mojo run --Werror -I . examples/http_hello.mojo"
example-http-json = "mojo run --Werror -I . examples/http_json.mojo"
package = "mkdir -p build && mojo precompile net -o build/net.mojoc"
test-package = "mojo run --Werror -I build tests/package_smoke.mojo"
benchmark-ip = "mojo run --Werror -I . benchmarks/ip_parse.mojo"
benchmark-loopback = "mojo run --Werror -I . benchmarks/loopback_io.mojo"
benchmark-http-parse = "mojo run --Werror -I . benchmarks/http_parse.mojo"

[dependencies]
mojo = ">=1.0.0,<2"
