[workspace]
channels = ["https://conda.modular.com/max", "conda-forge"]
name = "net-mojo"
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]
version = "0.1.0"

[tasks]
format = "mojo format net tests examples benchmarks"
test-core = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_core.mojo"
test-ip = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_ip.mojo"
test-address = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_address.mojo"
test-sys = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_sys.mojo"
test-tcp = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_tcp.mojo"
test-udp = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_udp.mojo"
test-unix = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_unix.mojo"
test-poll = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_poll.mojo"
test-reactor = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_reactor.mojo"
test-http-api = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_http_api.mojo"
test-http-parser = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_http_parser.mojo"
test-http-response = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_http_response.mojo"
test-http-server = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_http_server.mojo"
test-http2 = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_http2.mojo"
test-http-detach = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_http_detach.mojo"
test-actor = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_actor.mojo"
sanitize-sys = "mojo run --sanitize address -I . tests/test_sys.mojo"
sanitize-tcp = "mojo run --sanitize address -I . tests/test_tcp.mojo"
sanitize-udp = "mojo run --sanitize address -I . tests/test_udp.mojo"
sanitize-unix = "mojo run --sanitize address -I . tests/test_unix.mojo"
sanitize-actor = "mojo run --sanitize address -I . tests/test_actor.mojo"
sanitize-http2 = "mojo run --sanitize address -I . tests/test_http2.mojo"
sanitize-http-detach = "mojo run --sanitize address -I . tests/test_http_detach.mojo"
# Note: pixi runs depends-on tasks concurrently. To avoid high memory from parallel ASan runs, invoke individual tasks sequentially.
sanitize = { depends-on = [
  "sanitize-sys",
  "sanitize-tcp",
  "sanitize-udp",
  "sanitize-unix",
  "sanitize-actor",
  "sanitize-http2",
  "sanitize-http-detach",
] }
test = { depends-on = [
  "test-core",
  "test-ip",
  "test-address",
  "test-sys",
  "test-tcp",
  "test-udp",
  "test-unix",
  "test-poll",
  "test-reactor",
  "test-http-api",
  "test-http-parser",
  "test-http-response",
  "test-http-server",
  "test-http2",
  "test-http-detach",
  "test-actor",
] }
example-tcp = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . examples/tcp_echo.mojo"
example-udp = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . examples/udp_echo.mojo"
example-unix = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . examples/unix_echo.mojo"
example-http-hello = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . examples/http_hello.mojo"
example-http-json = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . examples/http_json.mojo"
example-http-sse = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . examples/http_sse.mojo"
package = "mkdir -p build && mojo precompile net -o build/net.mojoc"
test-package = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I build tests/package_smoke.mojo"
benchmark-ip = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . benchmarks/ip_parse.mojo"
benchmark-loopback = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . benchmarks/loopback_io.mojo"
benchmark-http-parse = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . benchmarks/http_parse.mojo"
benchmark-http-server = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . benchmarks/http_server.mojo"
benchmark-http-stream = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . benchmarks/http_stream.mojo"

[feature.tls.dependencies]
c-compiler = "*"
openssl = ">=3.2,<4"
pkg-config = "*"
python = ">=3.10,<3.15"

[feature.http2.dependencies]
c-compiler = "*"
libnghttp2 = ">=1.64,<2"
pkg-config = "*"

[feature.http2.tasks]
hpack-test = "bash scripts/build_hpack_shim.sh"
hpack-mojo-test = { cmd = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_hpack.mojo", depends-on = [
  "hpack-test",
] }
http2-package-smoke = { cmd = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I build tests/http2_package_smoke.mojo", depends-on = [
  "package",
  "hpack-test",
] }
http2-example-build = { cmd = "bash scripts/check_http2_example.sh", depends-on = [
  "tls-build",
  "hpack-test",
] }

[feature.http3.dependencies]
binutils = "*"
cmake = "*"
c-compiler = "*"
cxx-compiler = "*"
git = "*"
libclang = "*"
make = "*"
python = ">=3.10,<3.15"
rust = ">=1.88,<2"

[feature.http3.pypi-dependencies]
aioquic = "==1.3.0"

[feature.http3.tasks]
quic-build = "bash scripts/build_quic_provider.sh"
quic-test = { cmd = "build/quic/test_quic_provider build/tls/test-cert.pem build/tls/test-key.pem", depends-on = [
  "tls-build",
  "quic-build",
] }
quic-mojo-test = { cmd = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_quic_provider.mojo", depends-on = [
  "tls-build",
  "quic-build",
] }
quic-rust-test = { cmd = "bash scripts/test_quic_provider.sh", depends-on = [
  "tls-build",
  "quic-build",
] }
quic-suite = { depends-on = ["quic-test", "quic-mojo-test", "quic-rust-test"] }
http3-client-test = { cmd = "python3 scripts/test_http3_server.py", depends-on = [
  "tls-build",
  "quic-build",
] }
http3-package-smoke = { cmd = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I build tests/http3_package_smoke.mojo", depends-on = [
  "package",
  "tls-build",
  "quic-build",
] }
http3-example-build = { cmd = "bash scripts/check_http3_example.sh", depends-on = [
  "tls-build",
  "quic-build",
] }

[feature.tls.tasks]
tls-build = "bash scripts/build_tls_shim.sh"
tls-test = { cmd = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_tls.mojo", depends-on = [
  "tls-build",
] }
https-state-test = { cmd = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . tests/test_https_server.mojo", depends-on = [
  "tls-build",
] }
https-client-test = { cmd = "python3 scripts/test_https_server.py", depends-on = [
  "tls-build",
] }
https-example-build = { cmd = "bash scripts/check_https_example.sh", depends-on = [
  "tls-build",
] }
tls-suite = { depends-on = [
  "tls-test",
  "https-state-test",
  "https-client-test",
  "https-example-build",
] }
example-https-hello = { cmd = "mojo run --Werror --ignore-deprecated=String.as_c_string_slice --ignore-deprecated=CStringSpan.unsafe_ptr -I . examples/https_hello.mojo", depends-on = [
  "tls-build",
] }

[feature.mojo-1-0.dependencies]
mojo = ">=1.0.0,<1.1"

[feature.mojo-1-1.dependencies]
mojo = ">=1.1.0,<1.2"

[environments]
default = ["mojo-1-1"]
mojo-1-0 = ["mojo-1-0"]
tls = ["tls", "mojo-1-1"]
http2 = ["http2", "mojo-1-1"]
http3 = ["http3", "mojo-1-1"]
tls-http2 = ["tls", "http2", "mojo-1-1"]
tls-http3 = ["tls", "http3", "mojo-1-1"]
