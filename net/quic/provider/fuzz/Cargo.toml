[package]
name = "net-quic-provider-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.10"
net_quic_provider = { path = ".." }

[dev-dependencies]
quiche = { version = "=0.29.3", features = ["ffi"] }

[[bin]]
name = "recv_packet"
path = "fuzz_targets/recv_packet.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
